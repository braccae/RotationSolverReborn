name: Rebase Custom Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    name: Rebase custom-rotations onto main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase custom-rotations onto main
        run: |
          # Check if custom-rotations exists on remote
          if ! git ls-remote --exit-code --heads origin custom-rotations > /dev/null 2>&1; then
            echo "Remote branch 'custom-rotations' does not exist yet. Skipping rebase."
            exit 0
          fi

          echo "Fetching custom-rotations branch..."
          git fetch origin custom-rotations:custom-rotations
          git checkout custom-rotations

          echo "Rebasing custom-rotations onto origin/main..."
          if ! git rebase origin/main; then
            echo "::error::Rebase conflict encountered between custom-rotations and main. Aborting rebase."
            git rebase --abort
            exit 1
          fi

          echo "Pushing rebased custom-rotations to origin..."
          git push origin custom-rotations --force-with-lease
